name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Get Version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master
      - name: Generate Zip
        uses: papeloto/action-zip@v1
        with:
          files: dist/
          dest: vidat-v${{ steps.package-version.outputs.current-version}}.zip
      - name: Auto Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: Development Release v${{ steps.package-version.outputs.current-version}}
          files: |
            vidat-v${{ steps.package-version.outputs.current-version}}.zip
      - name: Deploy identical build to both origins
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          TARGET: ${{ vars.TARGET }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SJ_DEPLOY_HOST: ${{ vars.SJ_DEPLOY_HOST }}
          SJ_DEPLOY_USER: ${{ vars.SJ_DEPLOY_USER }}
          SJ_DEPLOY_PORT: ${{ vars.SJ_DEPLOY_PORT }}
          SJ_TARGET: ${{ vars.SJ_TARGET }}
          SJ_SSH_KNOWN_HOSTS: ${{ vars.SJ_SSH_KNOWN_HOSTS }}
          UMAMI_SCRIPT: ${{ secrets.UMAMI_SCRIPT }}
          CLARITY_SCRIPT: ${{ secrets.CLARITY_SCRIPT }}
        run: python3 scripts/deploy_dual.py
